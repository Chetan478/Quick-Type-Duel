<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Type Duel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #f0ede8;
            --accent: #e8736a;
            --accent-dark: #d9635a;
            --dark: #1a1a2e;
            --muted: #999;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(232,115,106,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(22,33,62,0.8) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #16213e 0%, #0f0f1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            padding: 24px;
        }

        /* floating particles */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20% 30%, rgba(232,115,106,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.15) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 70%, rgba(232,115,106,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.1) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 40%, rgba(232,115,106,0.2) 0%, transparent 100%);
            pointer-events: none;
        }

        .wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: pageIn 0.6s ease both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── HERO ── */
        .hero {
            text-align: center;
            padding: 8px 0 4px;
        }

        .hero-tag {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(232,115,106,0.12);
            border: 1px solid rgba(232,115,106,0.25);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 42px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 15px;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ── CARDS ── */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
            animation: cardIn 0.5s ease both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(232,115,106,0.4);
            flex-shrink: 0;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -0.3px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ── FORM ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: rgba(26,26,46,0.08);
            color: var(--dark);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]::placeholder {
            color: #bbb;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(232,115,106,0.05);
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(232,115,106,0.35);
            letter-spacing: 0.3px;
        }

        button[type="submit"]:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(232,115,106,0.45);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(26,26,46,0.12);
        }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="hero">
        <div class="hero-tag">Multiplayer Typing Game</div>
        <h1>Quick<span>Type</span><br>Duel</h1>
        <p>Play fast. Type faster.</p>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-icon">⚡</div>
            <div>
                <div class="card-title">Create Room</div>
                <div class="card-subtitle">Start a new game and invite friends</div>
            </div>
        </div>
        <form action="/create_room" method="POST">
            <div class="form-group">
                <input type="text" name="name" placeholder="Enter your name" required>
                <button type="submit">Create Room →</button>
            </div>
        </form>
    </div>

    <div class="divider">or</div>

    <div class="card">
        <div class="card-header">
            <div class="card-icon">🎯</div>
            <div>
                <div class="card-title">Join Room</div>
                <div class="card-subtitle">Enter a code to join your friends</div>
            </div>
        </div>
        <form action="/joining_room" method="POST">
            <div class="form-group">
                <input type="text" name="name" placeholder="Enter your name" required>
                <input type="text" name="room_code" placeholder="Enter room code" required style="font-family: 'JetBrains Mono', monospace; letter-spacing: 3px; text-transform: uppercase;">
                <button type="submit">Join Room →</button>
            </div>
        </form>
    </div>

    <div class="footer">quick draw duel — type to win</div>

</div>

</body>
</html>
