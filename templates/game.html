<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Type Duel</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            background-image: radial-gradient(ellipse at 20% 50%, #16213e 0%, #1a1a2e 50%, #0f0f1a 100%);
        }

        /* ── GAME CARD ── */
        .card {
            background: #f0ede8;
            border-radius: 24px;
            width: 380px;
            min-height: 520px;
            padding: 24px;
            position: relative;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── TOP BAR ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: #e8736a;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(232, 115, 106, 0.4);
        }

        .badge.timer-badge {
            background: #e8736a;
            min-width: 90px;
            text-align: center;
            transition: background 0.3s;
        }

        .badge.timer-badge.urgent {
            background: #c0392b;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* ── ROUND INDICATOR ── */
        .round-indicator {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── WORD DISPLAY ── */
        .word-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 0;
        }

        .word-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aaa;
        }

        .current-word {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(18px, 6vw, 42px);
    color: #1a1a2e;
    letter-spacing: clamp(1px, 1.5vw, 4px);
    text-align: center;
    transition: all 0.2s;
    min-height: 64px;
    word-break: break-all;
}

        .current-word.flash {
            color: #e8736a;
            transform: scale(1.05);
        }

        /* ── INPUT SECTION ── */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-section input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            background: #e8736a;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: background 0.2s, transform 0.1s;
        }

        .input-section input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .input-section input:focus {
            background: #d9635a;
            transform: scale(1.01);
        }

        .input-section input:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #e8736a;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            opacity: 0.85;
        }

        .submit-btn:hover {
            background: #d9635a;
            opacity: 1;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* ── WAITING MESSAGE ── */
        .waiting-msg {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            font-style: italic;
            display: none;
        }

        /* ── ROUND RESULT OVERLAY ── */
        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: #f0ede8;
            border-radius: 24px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 32px;
            z-index: 10;
            animation: fadeIn 0.3s ease;
        }

        .overlay.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .overlay h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            color: #1a1a2e;
            text-align: center;
        }

        .overlay .subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaa;
            font-weight: 600;
        }

        /* ── PLAYER RESULT ROWS ── */
        .player-rows {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0;
        }

        .player-row {
            background: #e8736a;
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 600;
            font-size: 15px;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.3s forwards;
        }

        .player-row:nth-child(2) { animation-delay: 0.1s; }
        .player-row:nth-child(3) { animation-delay: 0.2s; }
        .player-row:nth-child(4) { animation-delay: 0.3s; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .player-row .score-pill {
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 13px;
        }

        .player-row.winner-row {
            background: #1a1a2e;
        }

        /* ── READY BUTTON ── */
        .ready-btn {
            align-self: flex-end;
            padding: 14px 32px;
            border-radius: 14px;
            border: none;
            background: #e8736a;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(232, 115, 106, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .ready-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(232, 115, 106, 0.5);
        }

    </style>
</head>
<body>

<div class="card">

    <!-- ── GAME VIEW ── -->
    <div id="game-view">

        <div class="top-bar">
            <div class="badge" id="score-badge">Score: 0</div>
            <div class="badge timer-badge" id="timer-badge">⏱ 30s</div>
        </div>

        <div class="round-indicator" id="round-indicator">Round 1 of 3</div>

        <div class="word-section">
            <p class="word-label">Type this word</p>
            <p class="current-word" id="current-word">waiting</p>
        </div>

        <div class="input-section">
            <input type="text" id="ans-input" placeholder="Type the word here..." autocomplete="off">
            <button class="submit-btn" id="submit-btn">SUBMIT</button>
        </div>

        <p class="waiting-msg" id="waiting-msg">✋ Waiting for round to start...</p>

    </div>

    <!-- ── ROUND RESULT OVERLAY ── -->
    <div class="overlay" id="round-result">
        <p class="subtitle">Round Result</p>
        <h2 id="round-winner-text">Round Winner</h2>
        <div class="player-rows" id="round-player-rows">
            <!-- filled dynamically -->
        </div>
        <button class="ready-btn" id="ready-btn">Ready</button>
    </div>

    <!-- ── GAME END OVERLAY ── -->
    <div class="overlay" id="game-result">
        <p class="subtitle">Game Over</p>
        <h2 id="game-winner-text">🏆 Winner!</h2>
        <div class="player-rows" id="game-player-rows">
            <!-- filled dynamically -->
        </div>
        <button class="ready-btn" onclick="window.location='/'">Play Again</button>
    </div>

</div>

<script>
   const socket = io();
   const roomCode = "{{ room_code }}";
   socket.emit("join_game", {room_code: roomCode});

    socket.on("countdown", function(data) {
        document.getElementById("current-word").textContent = "⚡ " + data.seconds_left;
    });

    socket.on("word_result", function(data) {
        const input = document.getElementById("ans-input");
        if (data.correct) {
            input.style.background = "#27ae60";  // green flash
        } else {
            input.style.background = "#c0392b";  // red flash
        }
        setTimeout(function() { input.style.background = "#e8736a"; }, 400);

        if (data.next_word) {
            document.getElementById("current-word").textContent = data.next_word;
        } else {
            document.getElementById("current-word").textContent = "⏳ Waiting for others...";
            document.getElementById("ans-input").disabled = true;
            document.getElementById("submit-btn").disabled = true;
        }
        document.getElementById("score-badge").textContent = "Score: " + data.score;
    });

    socket.on("timer_tick", function(data) {
        document.getElementById("timer-badge").textContent = "⏱ " + data.seconds_left + "s";
    });

    socket.on("round_end", function(data) {
        document.getElementById("round-result").classList.add("visible");
        document.getElementById("round-winner-text").textContent = data.round_winner
    ? "🏆 " + data.round_winner + " wins!"
    : "🤝 It's a draw!";
        const rows = document.getElementById("round-player-rows");
        rows.innerHTML = "";
        data.players.forEach(function(player) {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = player.name + " — " + player.round_score + " pts";
            rows.appendChild(row);
        });
        document.getElementById("ready-btn").disabled = false;
        document.getElementById("ready-btn").textContent = "Ready";
    });

    socket.on("game_end", function(data){
        document.getElementById("game-result").classList.add("visible");
        document.getElementById("game-winner-text").textContent = data.game_winner
    ? "🏆 " + data.game_winner + " is the Winner!"
    : "🤝 It's a Draw!";
        const rows = document.getElementById("game-player-rows");
        rows.innerHTML = "";
        data.players.forEach(function(player) {
            const row = document.createElement("div");
            row.className = "player-row";
            row.innerHTML = player.name;
            rows.appendChild(row);
        });
    });

    document.getElementById("submit-btn").addEventListener("click", function() {
        const input = document.getElementById("ans-input");
        const word = input.value.trim();
        if (!word) return;
        socket.emit("submit_word", { room_code: roomCode, word: word });
        input.value = "";
        input.focus();
    });

    document.getElementById("ans-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            document.getElementById("submit-btn").click();
        }
    });

    document.getElementById("ready-btn").addEventListener("click", function() {
        socket.emit("join_game", { room_code: roomCode });
        this.disabled = true;
        this.textContent = "Waiting...";
    });

    socket.on("round_start", function(data) {
        document.getElementById("round-result").classList.remove("visible");
        document.getElementById("current-word").textContent = data.word;
        document.getElementById("round-indicator").textContent = "Round " + data.round + " of 3";
        // re-enable input
        document.getElementById("ans-input").disabled = false;
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("score-badge").textContent = "Score: 0";
    });
</script>

</body>
</html>
