<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Draw Duel — Error</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #f0ede8;
            --accent: #e8736a;
            --dark: #1a1a2e;
            --muted: #999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(232,115,106,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #16213e 0%, #0f0f1a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            padding: 24px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: cardIn 0.5s ease both;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-icon {
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(232,115,106,0.4);
        }

        .error-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(232,115,106,0.1);
            border: 1px solid rgba(232,115,106,0.2);
            padding: 5px 14px;
            border-radius: 20px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            color: var(--dark);
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
            line-height: 1.6;
            max-width: 280px;
        }

        a {
            display: inline-block;
            margin-top: 8px;
            padding: 13px 32px;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(232,115,106,0.4);
            transition: all 0.2s;
        }

        a:hover {
            background: #d9635a;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(232,115,106,0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="error-icon">⚠️</div>
        <span class="error-tag">Oops</span>
        <h1>{{ error_title }}</h1>
        <p>{{ error_message }}</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
